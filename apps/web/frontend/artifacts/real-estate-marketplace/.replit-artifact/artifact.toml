kind = "web"
previewPath = "/"
title = "Real Estate Marketplace"
description = "A Turkish real-estate marketplace frontend for discovering listings, managing favorites, agent applications and property listings, and administering platform records through the existing API."
version = "1.0.0"
id = "artifacts/real-estate-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24243

[services.development]
run = "pnpm --filter @workspace/real-estate-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/real-estate-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/real-estate-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24243"
BASE_PATH = "/"
